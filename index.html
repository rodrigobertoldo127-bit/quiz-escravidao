<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        * {

            margin: 0;
            padding: 0;

        }

        body {
            background: #111827;
            color: white;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .titulo p {
            color: #9ca3af;
        }

        .questao {
            background: #1f2937;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .questao h2 {
            font-size: 19px;
            margin-bottom: 20px;
        }

        .alternativa {
            display: block;
            background: #374151;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            cursor: pointer;
            transition: 0.2s;
        }

        .alternativa:hover {
            background: #4b5563;
        }

        .alternativa input {
            margin-right: 10px;
        }

        .alternativa.selecionada {
            background: #2563eb;
        }

        button {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #refazer {
            background: #16a34a;
            display: none;
            margin-top: 15px;
        }

        #refazer:hover {
            background: #15803d;
        }

        #resultado {
            display: none;
            background: #1f2937;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        #resultado h2 {
            margin-bottom: 15px;
        }

        .nota {
            font-size: 30px;
            font-weight: bold;
            margin: 15px 0;
        }

        .resposta {
            background: #374151;
            padding: 15px;
            border-radius: 10px;
            margin: 12px 0;
        }

        .acertou {
            border-left: 5px solid #22c55e;
        }

        .errou {
            border-left: 5px solid #ef4444;
        }

        .errado {
            color: #f87171;
            margin-top: 8px;
        }

        .correto {
            color: #4ade80;
            margin-top: 8px;
        }

        .parabens {
            background: #166534;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-size: 18px;
        }

    </style>
</head>

<body>

// =====================================================

// =====================================================

    },

    {

        alternativas: [
            "Aboliu a escravidão",

    },

    {

    },

    {

        alternativas: [

        ],

    },

    {
        pergunta: "Por aproximadamente quanto tempo a escravidão existiu no Brasil?",
        alternativas: [

        ],
        correta: 3
    },

    {
        pergunta: "Qual região brasileira teve grande expansão da produção de café no Segundo Reinado?",
        alternativas: [

        ],

    },

    {
        pergunta: "O crescimento do café aumentou a necessidade de:",

// =====================================================
// VARIÁVEIS
// =====================================================

let perguntas = perguntas1;


// =====================================================
// MOSTRAR PERGUNTAS
// =====================================================

function mostrarPerguntas() {

    const quiz = document.getElementById("quiz");

    quiz.innerHTML = "";

    perguntas.forEach((questao, numero) => {

        const div = document.createElement("div");

        div.classList.add("questao");

        div.innerHTML = `
            <h2>
                ${numero + 1}. ${questao.pergunta}
            </h2>

            ${questao.alternativas.map((alternativa, indice) => `

                <label class="alternativa">

                    <input
                        type="radio"
                        name="questao${numero}"
                        value="${indice}"
                        onchange="selecionar(this)"
                    >

                    ${String.fromCharCode(65 + indice)})
                    ${alternativa}

                </label>

            `).join("")}
        `;

        quiz.appendChild(div);

    });

}


// =====================================================
// SELECIONAR ALTERNATIVA
// =====================================================

function selecionar(input) {

    const alternativas = input
        .closest(".questao")
        .querySelectorAll(".alternativa");

    alternativas.forEach(alternativa => {

        alternativa.classList.remove("selecionada");

    });

    input
        .closest(".alternativa")
        .classList.add("selecionada");

}


// =====================================================
// FINALIZAR QUIZ
// =====================================================

function finalizarQuiz() {

    let acertos = 0;

    perguntas.forEach((questao, numero) => {

        const resposta = document.querySelector(
            `input[name="questao${numero}"]:checked`
        );

        if (resposta) {

            const escolhida = Number(resposta.value);

            if (escolhida === questao.correta) {

                acertos++;

            }

        }

    });


    const resultado = document.getElementById("resultado");

    resultado.style.display = "block";


    let html = `

        <h2>📊 Resultado</h2>

        <div class="nota">
            ${acertos}/20
        </div>

        <p>✅ Você acertou: <strong>${acertos}</strong></p>

        <p style="margin-top:8px;">
            ❌ Você errou:
            <strong>${20 - acertos}</strong>
        </p>

    `;


    if (acertos === 20) {

        html += `

            <div class="parabens">
                🏆 PARABÉNS! Você acertou todas!
            </div>

        `;

    }


    html += `

        <h2 class="titulo-resultado">
            📋 Confira suas respostas
        </h2>

    `;


    perguntas.forEach((questao, numero) => {

        const resposta = document.querySelector(
            `input[name="questao${numero}"]:checked`
        );

        let respostaUsuario;

        let acertou = false;


        if (resposta) {

            const indice = Number(resposta.value);

            respostaUsuario =
                questao.alternativas[indice];

            acertou =
                indice === questao.correta;

        } else {

            respostaUsuario =
                "Não respondeu";

        }


        html += `

            <div class="resposta ${acertou ? "acertou" : "errou"}">

                <strong>
                    Questão ${numero + 1}
                    ${acertou ? "✅ ACERTOU" : "❌ ERROU"}
                </strong>

                <p style="margin-top:10px;">
                    ${questao.pergunta}
                </p>

                <p class="${acertou ? "correto" : "errado"}">

                    ${acertou ? "✅" : "❌"}

                    Sua resposta:
                    ${respostaUsuario}

                </p>

                <p class="correto">

                    ✅ Resposta correta:
                    ${questao.alternativas[questao.correta]}

                </p>

            </div>

        `;

    });


    resultado.innerHTML = html;


    document.getElementById("refazer").style.display =
        "block";


    resultado.scrollIntoView({
        behavior: "smooth"
    });

}


// =====================================================
// REFAZER COM OUTRAS PERGUNTAS
// =====================================================

function refazerQuiz() {

    perguntas = perguntas2;


    document.getElementById("resultado").style.display =
        "none";


    document.getElementById("refazer").style.display =
        "none";


    mostrarPerguntas();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// =====================================================
// INICIAR QUIZ
// =====================================================

mostrarPerguntas();

</script>

</body>
</html>
