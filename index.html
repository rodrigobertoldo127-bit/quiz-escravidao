/* ==========================================
   COMEÇAR
========================================== */

function comecar() {

    const nome =
        document.getElementById("nome").value.trim();

    if (!nome) {

        document.getElementById("erroNome").textContent =
            "Digite seu nome para continuar.";

        return;
    }

    nomeJogador = nome;

    quizAtual = 1;

    document.getElementById("inicio")
        .classList.add("hidden");

    document.getElementById("placar")
        .classList.add("hidden");

    document.getElementById("resultadoTela")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.remove("hidden");

    document.getElementById("tituloQuiz").textContent =
        "📝 Primeiro Questionário";

    mostrarPerguntas(perguntas1);
}


/* ==========================================
   MOSTRAR PERGUNTAS
========================================== */

function mostrarPerguntas(lista) {

    const area =
        document.getElementById("perguntas");

    area.innerHTML = "";

    lista.forEach((q, index) => {

        let html = `

        <div class="question">

            <h3>
                ${index + 1}. ${q.pergunta}
            </h3>

        `;

        q.alternativas.forEach((alternativa, i) => {

            html += `

            <label>

                <input
                    type="radio"
                    name="pergunta${index}"
                    value="${i}"
                >

                ${alternativa}

            </label>

            `;

        });

        html += `</div>`;

        area.innerHTML += html;

    });

    window.scrollTo(0,0);
}


/* ==========================================
   FINALIZAR
========================================== */

function finalizar() {

    const lista =
        quizAtual === 1
        ? perguntas1
        : perguntas2;

    let pontos = 0;

    let respondeuTudo = true;

    lista.forEach((q,index) => {

        const resposta =
            document.querySelector(
                `input[name="pergunta${index}"]:checked`
            );

        if (!resposta) {

            respondeuTudo = false;

            return;
        }

        if (Number(resposta.value) === q.correta) {

            pontos++;

        }

    });


    if (!respondeuTudo) {

        document.getElementById("erroQuiz").textContent =
            "Responda todas as 20 perguntas.";

        return;
    }


    document.getElementById("erroQuiz").textContent = "";


    /* PRIMEIRO QUIZ */

    if (quizAtual === 1) {

        notaPrimeiro = pontos;

        document.getElementById("resultado").innerHTML = `

            <strong>
                ${escaparHTML(nomeJogador)}
            </strong>

            <br><br>

            Primeiro questionário:

            <br>

            <strong>
                ${notaPrimeiro}/20
            </strong>

        `;

        document.getElementById("btnSegundo")
            .style.display = "block";

        document.getElementById("avisoPlacar")
            .classList.remove("hidden");

    }


    /* SEGUNDO QUIZ */

    else {

        notaSegundo = pontos;

        const total =
            notaPrimeiro + notaSegundo;

        document.getElementById("resultado").innerHTML = `

            <strong>
                ${escaparHTML(nomeJogador)}
            </strong>

            <br><br>

            Primeiro questionário:

            <strong>
                ${notaPrimeiro}/20
            </strong>

            <br>

            Segundo questionário:

            <strong>
                ${notaSegundo}/20
            </strong>

            <br><br>

            🏆 Total:

            <strong>
                ${total}/40
            </strong>

        `;

        document.getElementById("btnSegundo")
            .style.display = "none";

        document.getElementById("avisoPlacar")
            .classList.add("hidden");

        salvarResultado();

    }


    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("resultadoTela")
        .classList.remove("hidden");

    window.scrollTo(0,0);
}

/* ==========================================
   SALVAR RESULTADO
========================================== */

async function salvarResultado() {

    const total =
        notaPrimeiro + notaSegundo;

    const status =
        document.getElementById("statusSalvar");

    status.className = "loading";

    status.textContent =
        "💾 Salvando resultado...";


    try {

        const {
            data: existente,
            error: erroBusca
        } = await supabaseClient

            .from("ranking_escravidao")

            .select("id")

            .eq("nome", nomeJogador)

            .maybeSingle();


        if (erroBusca) {

            throw erroBusca;

        }


        if (existente) {

            const { error } =

                await supabaseClient

                    .from("ranking_escravidao")

                    .update({

                        primeiro_quiz: notaPrimeiro,

                        segundo_quiz: notaSegundo,

                        total: total

                    })

                    .eq("id", existente.id);


            if (error) {

                throw error;

            }

        }


        else {

            const { error } =

                await supabaseClient

                    .from("ranking_escravidao")

                    .insert({

                        nome: nomeJogador,

                        primeiro_quiz: notaPrimeiro,

                        segundo_quiz: notaSegundo,

                        total: total

                    });


            if (error) {

                throw error;

            }

        }


        status.className = "sucesso";

        status.textContent =
            "✅ Resultado salvo no placar!";


        document.getElementById("placar")
            .classList.remove("hidden");

        carregarPlacar();


    }

    catch (erro) {

        console.error(erro);

        status.className = "erro";

        status.textContent =
            "❌ Erro ao salvar o resultado.";

    }

}


/* ==========================================
   CARREGAR PLACAR
========================================== */

async function carregarPlacar() {

    const lista =
        document.getElementById("rankingLista");

    lista.innerHTML = `
        <p class="loading">
            Carregando placar...
        </p>
    `;


    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("ranking_escravidao")

            .select("*")

            .order("total", {
                ascending: false
            })

            .limit(50);


        if (error) {

            throw error;

        }


        if (!data || data.length === 0) {

            lista.innerHTML = `
                <p class="loading">
                    Ainda não há resultados.
                </p>
            `;

            return;
        }


        lista.innerHTML = "";


        data.forEach((jogador,index) => {

            const posicao =
                index + 1;

            let medalha;

            let classe = "";


            if (posicao === 1) {

                medalha = "🥇";

                classe = "primeiro";

            }

            else if (posicao === 2) {

                medalha = "🥈";

                classe = "segundo";

            }

            else if (posicao === 3) {

                medalha = "🥉";

                classe = "terceiro";

            }

            else {

                medalha =
                    `${posicao}º`;

            }


            const coroa =
                posicao === 1
                ? " 👑"
                : "";


            lista.innerHTML += `

                <div class="ranking-item ${classe}">

                    <div>
                        ${medalha}
                    </div>

                    <div class="nome">
                        ${escaparHTML(jogador.nome)}${coroa}
                    </div>

                    <div>
                        ${jogador.primeiro_quiz}/20
                    </div>

                    <div>
                        ${jogador.segundo_quiz}/20
                    </div>

                    <div class="total">
                        ${jogador.total}/40
                    </div>

                </div>

            `;

        });

    }


    catch (erro) {

        console.error(erro);

        lista.innerHTML = `

            <p class="erro">
                ❌ Erro ao carregar o placar.
            </p>

        `;

    }

}


/* ==========================================
   PROTEGER NOME
========================================== */

function escaparHTML(texto) {

    const div =
        document.createElement("div");

    div.textContent = texto;

    return div.innerHTML;

}

</script>
